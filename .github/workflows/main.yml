name: Build Android APK dari ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cari dan Ekstrak ZIP Project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "=== ERROR: FILE ZIP TIDAK DITEMUKAN DI REPOSITORI! ==="
            echo "Pastikan Anda sudah mengunggah file .zip ke halaman depan repositori ini."
            exit 1
          fi
          echo "Mengekstrak $ZIP_FILE..."
          mkdir -p project_dir
          unzip -o "$ZIP_FILE" -d project_dir
          
          echo "=== ISI FOLDER SETELAH DIEKSTRAK ==="
          ls -R project_dir

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle Wrapper
        run: |
          # Cari di mana letak file build.gradle berada
          GRADLE_DIR=$(find project_dir -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "=== ERROR: File build.gradle tidak ditemukan di dalam ZIP! ==="
            exit 1
          fi
          echo "Folder project utama ditemukan di: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          npm install -g @ionic/cli
          gradle wrapper --gradle-version 8.2
          echo "TARGET_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd ${{ env.TARGET_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK Hasil Compile
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-WarungKu-Debug
          path: |
            ${{ env.TARGET_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.TARGET_DIR }}/*/build/outputs/apk/debug/*.apk
